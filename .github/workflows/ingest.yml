name: Ingest

# Collects the configured feeds every hour and commits public/data only when the content changed.
# Vercel is connected to this repository and redeploys on every push to main, including these data commits.
# Feeds update on their own schedule; running hourly does not mean every feed has new items each hour.
on:
  schedule:
    - cron: '17 * * * *' # minute 17 avoids the top-of-hour rush; GitHub may still delay scheduled runs
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect feeds
        run: npm run ingest

      # Optional: summaries, impact notes and translations via the Gemini API free tier.
      # Skipped when the GEMINI_API_KEY secret is missing; a failure here never blocks the data commit.
      - name: Write AI insights
        continue-on-error: true
        timeout-minutes: 25 # briefings are saved one by one, so a cut-off run still commits what it wrote
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Free tier: when the daily quota runs out Google answers 429 and the run stops; nothing is billed.
          INSIGHTS_MAX_PER_RUN: ${{ vars.INSIGHTS_MAX_PER_RUN || '40' }}
        run: npm run insights

      - name: Commit data if it changed
        id: commit
        run: |
          # Stage first so new (untracked) insight files are detected too.
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update articles $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

